<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero headlines</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Remake design system (landing-page-design.md v2.1), limited to the six-colour palette:
   navy, blue, mustard, beige, black, white. Substitutions: sky → mustard (italic word), on-navy-muted → beige,
   ink → black, ink-muted → navy, line / canvas-alt → beige, navy-dot → blue dots. */
:root{--n:#060a47;--b:#1a33f2;--m:#f2b705;--e:#f6f1e7;--k:#000;--w:#fff;
  --serif:'Newsreader',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{margin:0}
body{font:400 16px/24px var(--sans);color:var(--k);background:var(--w)}
button{font:inherit}

/* ===================== Overview page ===================== */
.ov{background:var(--e);min-height:100vh}
.ov .wrap{max-width:1240px;margin:0 auto;padding:44px 32px 80px}
.ov .meta{font:500 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--b);margin:0}
.ov h1{font:400 60px/1.02 var(--serif);letter-spacing:-.02em;color:var(--n);margin:12px 0 14px}
.ov h2{font:400 40px/1.05 var(--serif);letter-spacing:-.02em;color:var(--n);margin:6px 0 8px}
.ov .lede{font-size:18px;line-height:28px;color:var(--n);max-width:760px;margin:0}
.ov section{padding:44px 0;border-top:1px solid var(--n)}
.ov section:first-of-type{margin-top:32px}
.opt-h{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.opt-h p{margin:0;max-width:700px;color:var(--n)}
.rec-tag{display:inline-block;background:var(--m);color:var(--n);font:600 12px/18px var(--sans);padding:3px 10px;border-radius:999px;vertical-align:middle;margin-left:8px}
.replay{appearance:none;border:1.5px solid var(--n);background:transparent;color:var(--n);border-radius:999px;height:44px;padding:0 20px;font:500 15px var(--sans);cursor:pointer;transition:background .2s var(--ease),color .2s var(--ease)}
.replay:hover{background:var(--n);color:var(--w)}
.replay:focus-visible{outline:2px solid var(--b);outline-offset:3px}
.frames{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
.frame{min-width:0}
.frame .cap{font:500 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--n);margin:0 0 8px}
.vp{position:relative;overflow:hidden;background:var(--w);box-shadow:0 0 0 1px var(--n);border-radius:6px}
.vp iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;display:block}
.vp.phone{border-radius:28px;box-shadow:0 0 0 8px var(--n)}
.open{font-size:13px;color:var(--b);margin-top:8px;display:inline-block}
.recbox{background:var(--n);color:var(--w);padding:32px;border-radius:24px}
.recbox h2{color:var(--w)}
.recbox p{color:var(--e);margin:0 0 12px;max-width:820px}
.notes{font-size:14px;color:var(--n);max-width:860px}
.notes li{margin-bottom:6px}
@media (max-width:900px){.frames{grid-template-columns:minmax(0,1fr)}.vp.phone{max-width:330px}}
@media (max-width:640px){.ov .wrap{padding:28px 16px 60px}.ov h1{font-size:40px}.ov h2{font-size:30px}}

/* ===================== The hero (rendered alone with ?only=a|b|c) ===================== */
.rk{background:var(--w);color:var(--k);overflow-x:hidden}
.rk-wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.rk-nav{position:sticky;top:0;z-index:20;background:var(--w);border-bottom:1px solid var(--e)}
.rk-nav-in{display:flex;align-items:center;gap:32px;height:64px}
.rk-logo{font:500 26px/1 var(--serif);letter-spacing:-.02em;color:var(--n);text-decoration:none}
.rk-links{display:flex;gap:28px}
.rk-links a{color:var(--n);text-decoration:none;font-size:15px}
.rk-nav-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.rk-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1.5px solid transparent;font:500 15px/1 var(--sans);padding:12px 20px;min-height:44px;cursor:pointer;text-decoration:none;transition:background .2s var(--ease)}
.rk-btn-primary{background:var(--b);color:var(--w)}
.rk-btn-primary .rk-arrow{transition:transform .2s var(--ease)}
.rk-btn-primary:hover .rk-arrow{transform:translateX(3px)}
.rk-btn-on-navy{background:transparent;color:var(--w);border-color:var(--e)}
.rk-btn-ghost{background:transparent;color:var(--k);padding-inline:14px}
.rk-btn-sm{padding:10px 16px;min-height:40px;font-size:14px}
.rk-btn-big{padding:15px 26px;min-height:52px;font-size:16px}
.rk-btn:focus-visible{outline:2px solid var(--m);outline-offset:3px}
.rk-badge{display:inline-flex;align-items:center;gap:4px;justify-self:start;padding:3px 10px;border-radius:999px;font:500 12px/18px var(--sans);white-space:nowrap}
.rk-badge-best,.rk-badge-new{background:var(--m);color:var(--n);font-weight:600}
.rk-badge-score{background:var(--w);color:var(--b);box-shadow:inset 0 0 0 1px var(--b);font-family:var(--mono);font-weight:400}

.rk-hero{padding-top:24px;padding-bottom:64px}
.rk-panel{position:relative;background-color:var(--n);color:var(--w);border-radius:40px;overflow:hidden;isolation:isolate}
.rk-dots{background-image:radial-gradient(circle at 1px 1px,rgba(26,51,242,.5) 1px,transparent 1.5px);background-size:24px 24px}
.rk-hero-panel{display:grid;justify-items:center;text-align:center;gap:18px;padding:72px 40px 200px}
.rk-announce{display:inline-flex;align-items:center;gap:10px;padding:4px 14px 4px 4px;border-radius:999px;border:1px solid rgba(246,241,231,.35);font-size:13px;color:var(--e)}
.rk-hero h1{font:400 clamp(42px,6vw,76px)/1.02 var(--serif);letter-spacing:-.02em;margin:0;max-width:900px;text-wrap:balance}
.rk-hero h1 em{color:var(--m)}
.rk-lede{font-size:18px;line-height:28px;color:var(--e);max-width:600px;margin:0}
.rk-ctas{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:10px}
.rk-note{font-size:13px;color:var(--e);margin:0}

.rk-demo{position:relative;z-index:2;max-width:1136px;margin:-150px auto 0;background:var(--w);border:1px solid var(--e);border-radius:20px;box-shadow:0 24px 60px rgba(6,10,71,.22);text-align:left;color:var(--k)}
.rk-demo-bar{display:flex;align-items:center;gap:12px;height:48px;padding:0 20px;background:var(--e);border-radius:20px 20px 0 0}
.rk-demo-dots{display:flex;gap:6px}.rk-demo-dots i{width:11px;height:11px;border-radius:50%;background:var(--n);opacity:.25}
.rk-demo-url{font:400 14px var(--mono);color:var(--n);margin:0 auto;transform:translateX(-24px)}
.rk-demo-body{padding:28px;display:grid;gap:18px}
.rk-demo-platforms{display:flex;flex-wrap:wrap;gap:8px}
.rk-demo-platforms button{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 8px;border:1px solid var(--e);border-radius:999px;background:var(--w);color:var(--n);font:500 15px/1 var(--sans);cursor:pointer}
.rk-demo-platforms button.is-on{border-color:var(--n);background:var(--n);color:var(--w)}
.pl-dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 11px/1 var(--sans);background:var(--e);color:var(--n)}
.is-on .pl-dot{background:var(--w)}
.rk-demo-top{display:grid;grid-template-columns:1fr auto;gap:14px}
.rk-demo-search{display:flex;align-items:center;gap:12px;height:60px;padding:0 20px;border-radius:12px;border:1px solid var(--n);color:var(--n);font-size:19px}
.rk-demo-search span{color:var(--k);font-weight:500}
.rk-demo-client{align-self:center;padding:8px 16px;border-radius:999px;border:1px solid var(--n);font-weight:500;color:var(--n)}
.rk-demo-about{font:400 14px/20px var(--mono);letter-spacing:.02em;color:var(--n);margin:0}
.rk-demo-picks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rk-demo-picks>li{min-width:0}
.rk-pick{width:100%;height:100%;display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:start;text-align:left;color:inherit;background:var(--w);border:1px solid var(--e);border-radius:14px;padding:14px;cursor:pointer}
.rk-pick-thumb{position:relative;aspect-ratio:9/16;border-radius:10px;background:var(--n) center/cover no-repeat}
.rk-pick-thumb .tag{position:absolute;left:6px;top:6px;width:26px;height:26px;border-radius:50%;background:var(--n);color:var(--w);display:grid;place-items:center}
.rk-pick-text{display:grid;gap:6px;min-width:0}
.rk-pick-title{font-weight:600;font-size:18px;line-height:1.3}
.rk-pick-meta{font:400 13px/1.4 var(--mono);color:var(--n)}
.rk-pick-why{font-size:15px;color:var(--n);line-height:1.45}
.rk-pick .rk-badge{margin-top:8px;padding:4px 12px;font-size:14px;line-height:20px}

/* The play-mark canvas, as in Concept C: drawn at 440 × 460, never smoothed */
canvas.pm{display:block;image-rendering:pixelated;pointer-events:none}

/* ---------- A · Backdrop ---------- */
.opt-a .rk-hero-panel{justify-items:start;text-align:left;padding:64px 56px 210px}
.opt-a .pm{position:absolute;z-index:-1;width:660px;height:690px;right:-10px;top:20px}
.opt-a .plate{display:grid;justify-items:start;gap:18px;background:var(--n);border-radius:0 28px 28px 0;padding:28px 32px 28px 0;margin-left:0;max-width:610px}
.opt-a .rk-ctas{justify-content:flex-start}
.opt-a .rk-hero h1,.opt-a h1{max-width:620px}

/* ---------- B · Tiles become the card ---------- */
.opt-b .rk-hero-panel{grid-template-columns:minmax(0,1fr) minmax(0,560px);justify-items:start;text-align:left;align-items:center;gap:48px;padding:64px 48px 64px 56px}
.opt-b .copy{display:grid;justify-items:start;gap:18px}
.opt-b .rk-ctas{justify-content:flex-start}
.opt-b .rk-hero h1{font-size:clamp(42px,4.6vw,64px)}
.opt-b .stage{position:relative;width:100%;min-width:0}
.opt-b .stage .pm{position:absolute;left:50%;top:50%;width:440px;height:460px;transform:translate(-50%,-50%);transition:opacity .45s var(--ease)}
.opt-b .rk-demo{margin:0;max-width:none;transition:opacity .5s var(--ease),transform .5s var(--ease)}
.opt-b .rk-demo-body{padding:20px;gap:14px}
.opt-b .rk-demo-picks{grid-template-columns:1fr;gap:10px}
.opt-b .rk-pick{grid-template-columns:64px 1fr;padding:10px;gap:12px}
.opt-b .rk-pick-title{font-size:16px}
.opt-b .rk-pick-why{font-size:14px}
.opt-b .rk-pick .rk-badge{margin-top:2px}
.opt-b .rk-demo-search{height:48px;font-size:17px}
.opt-b .stage.pending .rk-demo{opacity:0;transform:translateY(12px)}
.opt-b .stage.handoff .pm{opacity:0}
.fly{position:absolute;z-index:30;background:var(--m);pointer-events:none;transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .25s linear .75s}
.rk-badge-best.pop{animation:pop .45s var(--ease)}
@keyframes pop{40%{transform:scale(1.12)}100%{transform:none}}

/* ---------- C · Inline mark + edge field ---------- */
.opt-c .rk-hero-panel{padding:72px 160px 200px}
.opt-c h1 .film{white-space:nowrap}
.opt-c h1 .pm{display:inline-block;vertical-align:-0.12em;width:1.04em;height:1.09em;margin:0 .08em 0 .1em;image-rendering:auto}
.opt-c .edge{position:absolute;top:0;z-index:-1;width:144px;height:100%}
.opt-c .edge.l{left:0}.opt-c .edge.r{right:0}
.opt-c .edge.t{display:none}

/* Demo card: live behaviour (disabled platforms, typed search) */
.pl-ic{width:22px;height:22px;flex:none;display:block}
.rk-demo-platforms button:disabled{opacity:.4;filter:grayscale(1);cursor:not-allowed}
.rk-demo-search .typed{white-space:pre;overflow:hidden;text-overflow:clip;min-width:0}
.rk-demo-search .caret{flex:none;width:2px;height:1.15em;margin-left:-10px;background:var(--k);animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
/* Headline variants: only size and line breaks change */
.opt-b .v1 h1{font-size:clamp(42px,4.4vw,60px)}
.opt-b .v2 h1{font-size:clamp(40px,4.6vw,60px)}
.opt-b .v3 h1{font-size:clamp(42px,4.4vw,60px)}
h1 .ln{display:block}
.opt-b h1 em{color:var(--m)}
@media (max-width:960px){
  .opt-b .rk-hero-panel{grid-template-columns:minmax(0,1fr);gap:32px}
  .opt-b .stage{max-width:560px}
}
@media (max-width:720px){
  .rk-wrap{padding:0 16px}
  .rk-links{display:none}
  .rk-nav-in{height:60px;gap:12px}
  .rk-nav-actions .rk-btn-ghost{padding-inline:10px}
  .rk-hero{padding-top:12px}
  .rk-panel{border-radius:24px}
  .rk-hero-panel{padding:48px 20px 140px}
  .rk-hero h1{font-size:40px}
  .rk-lede{font-size:17px}
  .rk-ctas{width:100%}.rk-ctas .rk-btn{width:100%}
  .rk-announce{font-size:12px}
  .rk-demo{margin-top:-110px}
  .rk-demo-body{padding:16px}
  .rk-demo-top{grid-template-columns:1fr}.rk-demo-client{justify-self:start}
  .rk-demo-picks{grid-template-columns:1fr}
  .rk-pick{grid-template-columns:72px 1fr}
  .rk-pick .rk-badge{font-size:12px;padding:3px 10px;white-space:normal}
  .rk-demo-url{transform:none}
  /* A: the mark becomes a band above the copy, the plate goes full width */
  .opt-a .rk-hero-panel{padding:300px 20px 140px}
  .opt-a .pm{width:290px;height:303px;right:auto;left:50%;top:6px;transform:translateX(-50%)}
  .opt-a .plate{max-width:none;width:100%;padding:20px 0 0;box-shadow:0 -20px 0 0 var(--n);border-radius:0}
  .opt-a .rk-hero h1{font-size:40px}
  /* B */
  .opt-b .rk-hero-panel{padding:48px 20px 24px}
  .opt-b .rk-hero h1{font-size:40px}
  .opt-b .stage .pm{width:330px;height:345px}
  .opt-b .v1 h1{font-size:36px}.opt-b .v2 h1{font-size:36px}.opt-b .v3 h1{font-size:37px}
  /* C: edges move to a top strip */
  .opt-c .rk-hero-panel{padding:104px 20px 140px}
  .opt-c .edge.l,.opt-c .edge.r{display:none}
  .opt-c .edge.t{display:block;left:0;top:0;width:100%;height:80px}
}
@media (prefers-reduced-motion:reduce){
  .rk *{transition:none!important;animation:none!important}
}
</style>
</head>

    { title: 'Welcher Tofu schmeckt euch am besten?', score: '172×', why: 'A first taste of one store product. Shows the pack up close.', account: '@siiielle', views: '84K views · usually 492', cover: 'dm' },
    { title: 'POV: you’re plant-based and too lazy to cook', score: '2,214×', why: 'A short, relatable clip. Matches their “quick dinners” posts.', account: '@margo_miuller', views: '1.9M views · usually 858', cover: 'pov' },
  ];
  // Simple marks in the palette (currentColor), not the platforms' brand artwork. YouTube, X and Reddit are disabled, as on the live page.
  const GLYPH = {
    Instagram: '<rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.2" cy="6.8" r="1.25" fill="currentColor"/>',
    YouTube: '<rect x="2" y="5.5" width="20" height="13" rx="4" fill="currentColor"/><path d="M10 9v6l5.2-3z" fill="#fff"/>',
    TikTok: '<path d="M13.5 3h3c.3 2.2 1.7 3.6 4 3.9v3c-1.5 0-2.9-.4-4-1.2V15a6 6 0 1 1-6-6v3.1a2.9 2.9 0 1 0 3 2.9z" fill="currentColor"/>',
    X: '<path d="M4 4h4.6L20 20h-4.6z" fill="currentColor"/><path d="M19.4 4l-5.9 6.6M10.5 13.4 4.6 20" stroke="currentColor" stroke-width="2"/>',
    Reddit: '<ellipse cx="12" cy="14.5" rx="8.5" ry="5.8" fill="currentColor"/><circle cx="18.6" cy="5" r="1.9" fill="currentColor"/><path d="M12 8.7 13.4 4l5.2 1" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="14" r="1.3" fill="#fff"/><circle cx="15" cy="14" r="1.3" fill="#fff"/>',
  };
  const PLATFORMS = [['Instagram', 0], ['YouTube', 1], ['TikTok', 0], ['X', 1], ['Reddit', 1]];
  const play = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M8 5.5v13l10-6.5z" fill="currentColor"/></svg>';
  const nav = `<nav class="rk-nav" aria-label="Main"><div class="rk-wrap rk-nav-in"><a class="rk-logo" href="#top" aria-label="Remake">Remake</a>
      <div class="rk-links"><a href="#how">How it works</a><a href="#faq">FAQ</a></div>
      <div class="rk-nav-actions"><button type="button" class="rk-btn rk-btn-ghost">Log in</button><button type="button" class="rk-btn rk-btn-primary rk-btn-sm">Try the demo</button></div></div></nav>`;
  const announce = '<span class="rk-announce"><span class="rk-badge rk-badge-new">New</span> Instagram search is coming soon</span>';
  const h1 = (film) => `<h1>Know what each client should ${film || '<em>film</em>'} this week.</h1>`;
  const SUB = '<p class="rk-lede">Find what’s trending, see why it worked, plan the shots, drop in your footage, and we’ll cut it together. Then edit it in Remake.</p>';
  const VARIANTS = {
    1: { h: '<h1>See a video that’s working? <em>Remake</em> it for your client.</h1>', sub: SUB },
    2: { h: '<h1><span class="ln">Trending on Monday.</span><span class="ln">Posted by Friday.</span></h1>', sub: SUB },
    3: { h: '<h1><span class="ln">Find what’s working.</span><span class="ln"><em>Film</em> your version.</span><span class="ln">We’ll cut it.</span></h1>', sub: SUB },
  };
  const lede = '<p class="rk-lede">Remake finds the TikToks worth copying for each client, plans the shots, and gets your manager’s OK before you film. Made for agencies with 5 to 20 clients.</p>';
  const ctas = `<div class="rk-ctas"><button type="button" class="rk-btn rk-btn-primary rk-btn-big">Try the demo <span class="rk-arrow" aria-hidden="true">→</span></button>
      <a class="rk-btn rk-btn-on-navy rk-btn-big" href="#tour">${play} Watch the tour (under a minute)</a></div>`;
  const note = '<p class="rk-note">No sign-up. A sample agency is ready to go.</p>';
  const demo = `<div class="rk-demo" aria-label="Example: a search for tofu, picked for Evergreen Foods">
      <div class="rk-demo-bar"><span class="rk-demo-dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="rk-demo-url">remake.app</span></div>
      <div class="rk-demo-body">
        <div class="rk-demo-platforms" role="group" aria-label="Where to search">${PLATFORMS.map(([n, off]) => `<button type="button" class="${n === 'TikTok' ? 'is-on' : ''}" aria-pressed="${n === 'TikTok'}"${off ? ' disabled title="Coming soon"' : ''}><svg class="pl-ic" viewBox="0 0 24 24" aria-hidden="true">${GLYPH[n]}</svg><span>${n}</span></button>`).join('')}</div>
        <div class="rk-demo-top"><div class="rk-demo-search"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span class="typed" aria-live="off">tofu</span><i class="caret" aria-hidden="true"></i></div><span class="rk-demo-client">Evergreen Foods</span></div>
        <p class="rk-demo-about">Plant-based meals · has a test kitchen</p>
        <ul class="rk-demo-picks">${PICKS.map((p, i) => `<li><button type="button" class="rk-pick" aria-haspopup="dialog">
            <span class="rk-pick-thumb" role="img" aria-label="Trending video: ${p.title}" style="background-image:url(${COVERS[p.cover]})"><span class="tag">${play}</span></span>
            <span class="rk-pick-text"><span class="rk-pick-title">${p.title}</span><span class="rk-pick-meta">${p.account} · ${p.views}</span><span class="rk-pick-why">${p.why}</span>
            ${i === 0 ? `<span class="rk-badge rk-badge-best">★ Best to copy · ${p.score}</span>` : `<span class="rk-badge rk-badge-score">${p.score} their usual views</span>`}</span></button></li>`).join('')}</ul>
      </div></div>`;
  const pm = (cls = '', label = 'A play mark made of small video frames; three of them, the ones far above their usual views, are mustard') => `<canvas class="pm ${cls}" data-shape="play" width="440" height="460" role="img" aria-label="${label}"></canvas>`;

  const HEROES = {
    a: () => `<main class="rk opt-a">${nav}<header id="top" class="rk-hero"><div class="rk-wrap">
        <div class="rk-panel rk-dots rk-hero-panel">${pm()}<div class="plate">${announce}${h1()}${lede}${ctas}${note}</div></div>${demo}</div></header></main>`,
    b: () => `<main class="rk opt-b">${nav}<header id="top" class="rk-hero"><div class="rk-wrap">
        <div class="rk-panel rk-dots rk-hero-panel"><div class="copy">${announce}${h1()}${lede}${ctas}${note}</div>
          <div class="stage pending">${demo}${pm()}</div></div></div></header></main>`,
    ...Object.fromEntries([1, 2, 3, 4].map((v) => [v, () => `<main class="rk opt-b">${nav}<header id="top" class="rk-hero"><div class="rk-wrap">
        <div class="rk-panel rk-dots rk-hero-panel"><div class="copy v${v}">${announce}${VARIANTS[v] ? VARIANTS[v].h + VARIANTS[v].sub : h1() + lede}${ctas}${note}</div>
          <div class="stage pending">${demo}${pm()}</div></div></div></header></main>`])),
    c: () => `<main class="rk opt-c">${nav}<header id="top" class="rk-hero"><div class="rk-wrap">
        <div class="rk-panel rk-dots rk-hero-panel"><canvas class="pm edge l" data-shape="edgeL" width="144" height="720" aria-hidden="true"></canvas><canvas class="pm edge r" data-shape="edgeR" width="144" height="720" aria-hidden="true"></canvas><canvas class="pm edge t" data-shape="edgeT" width="400" height="80" aria-hidden="true"></canvas>
          ${announce}${h1(`<span class="film"><em>film</em>${pm('', 'A small play mark made of video frames')}</span>`)}${lede}${ctas}${note}</div>${demo}</div></header></main>`,
  };

  /* ---------- The tile engine: Concept C thumbs(), unchanged ---------- */
  const inTri = (c, r, cols, rows) => { const u = (c + 0.5) / cols, v = (r + 0.5) / rows; const xL = 0.12, xR = 0.92; if (u < xL || u > xR) return 0; const half = 0.46 * (1 - (u - xL) / (xR - xL)); const dv = Math.abs(v - 0.5); return dv < half ? 1 : dv < half + 0.06 ? 0.4 : 0; };
  // C only: the edge field. A ragged band of the same tiles, densest at the outer edge.
  const noise = (x, y) => { const s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return s - Math.floor(s); };
  const band = (d, c, r) => { const lim = 0.25 + noise(c, r * 3) * 0.55; return d < lim * 0.7 ? 1 : d < lim ? 0.4 : 0; };
  const SHAPES = {
    play: inTri,
    edgeL: (c, r, cols) => band((c + 0.5) / cols, c, r),
    edgeR: (c, r, cols) => band(1 - (c + 0.5) / cols, c, r),
    edgeT: (c, r, cols, rows) => band((r + 0.5) / rows, c, r),
  };
  let seed = 1; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  function build(cv) {
    const kind = cv.dataset.shape, W = cv.width, Hh = cv.height, x = cv.getContext('2d');
    const T = 16, cols = Math.floor(W / T), rows = Math.floor(Hh / T), tiles = [];
    const inS = (c, r) => SHAPES[kind](c, r, cols, rows);
    seed = kind === 'play' ? 11 : 5;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const k = inS(c, r); if (k && rnd() < (k === 1 ? 0.93 : 0.35)) tiles.push({ c, r, bg: [K.n, K.b, K.n, K.e, K.k][Math.floor(rnd() * 5)], fg: [K.w, K.m, K.e, K.b][Math.floor(rnd() * 4)], sx: rnd() * W, sy: rnd() * Hh, t: rnd() * 0.7, hit: false, s: rnd() < 0.18 ? 10 : 14 }); }
    for (let i = 0; i < (kind === 'play' ? 60 : 12); i++) { const c = Math.floor(rnd() * cols), r = Math.floor(rnd() * rows); if (!inS(c, r)) tiles.push({ c, r, bg: rnd() < 0.5 ? K.n : K.k, fg: null, sx: rnd() * W, sy: rnd() * Hh, t: rnd() * 0.9, hit: false, s: [4, 6, 8][Math.floor(rnd() * 3)], loose: true }); }
    if (kind === 'play') { const core = tiles.filter((t) => !t.loose); [0.15, 0.48, 0.81].forEach((f) => { const t = core[Math.floor(f * core.length)]; if (t) t.hit = true; }); }
    const paint = (p) => {
      x.clearRect(0, 0, W, Hh);
      tiles.forEach((t) => {
        const q = Math.max(0, Math.min(1, (p - t.t) / 0.3)), e = 1 - Math.pow(1 - q, 3);
        if (q <= 0) return;
        const tx = t.c * T + (T - t.s) / 2, ty = t.r * T + (T - t.s) / 2;
        const X = Math.round(t.sx + (tx - t.sx) * e), Y = Math.round(t.sy + (ty - t.sy) * e);
        x.fillStyle = t.hit && q >= 1 ? K.m : t.bg; x.fillRect(X, Y, t.s, t.s);
        if (t.fg && t.s >= 10) { x.fillStyle = t.hit && q >= 1 ? K.k : t.fg; x.fillRect(X + 3, Y + t.s - 6, t.s - 6, 2); x.fillRect(X + (t.s >> 1) - 1, Y + 3, 3, 3); }
      });
    };
    return { paint, tiles, T };
  }
  const runs = new WeakMap();
  // plays once (1.8s), never loops; reduced motion paints the final state
  function run(cv, done) {
    if (cv.classList.contains('edge')) { cv.width = Math.max(16, Math.round(cv.clientWidth)); cv.height = Math.max(16, Math.round(cv.clientHeight)); }
    const eng = build(cv), token = {}; runs.set(cv, token);
    if (reduce()) { eng.paint(2); cv.dataset.done = '1'; done && done(eng, true); return; }
    const dur = 1800, t0 = performance.now(); cv.dataset.done = '';
    const tick = (t) => { if (runs.get(cv) !== token) return; const p = Math.min(1.3, (t - t0) / dur * 1.3); eng.paint(p); if (p < 1.3) requestAnimationFrame(tick); else { cv.dataset.done = '1'; done && done(eng, false); } };
    requestAnimationFrame(tick);
  }

  /* B: after the play mark settles, the card takes its place and the three mustard tiles fly to "Best to copy" */
  let bTimer = 0;
  function handoffB(root, eng, instant) {
    const stage = root.querySelector('.stage'), cv = stage.querySelector('.pm'), badge = root.querySelector('.rk-badge-best');
    if (instant) { stage.classList.remove('pending'); stage.classList.add('handoff'); return; }
    clearTimeout(bTimer);
    bTimer = setTimeout(() => {
      const r = cv.getBoundingClientRect(), sc = r.width / cv.width, sr = stage.getBoundingClientRect();
      const hits = eng.tiles.filter((t) => t.hit);
      stage.classList.remove('pending'); stage.classList.add('handoff');
      const b = badge.getBoundingClientRect();
      hits.forEach((t, i) => {
        const f = document.createElement('i'); f.className = 'fly';
        const x0 = r.left - sr.left + (t.c * eng.T + (eng.T - t.s) / 2) * sc, y0 = r.top - sr.top + (t.r * eng.T + (eng.T - t.s) / 2) * sc, s = t.s * sc;
        f.style.cssText += `left:${x0}px;top:${y0}px;width:${s}px;height:${s}px`;
        stage.appendChild(f);
        const tx = b.left - sr.left + 10 + i * 8 - x0, ty = b.top - sr.top + b.height / 2 - s / 2 - y0;
        requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transform = `translate(${tx}px,${ty}px) scale(.6)`; f.style.opacity = '0'; }));
        setTimeout(() => f.remove(), 1100);
      });
      setTimeout(() => { badge.classList.remove('pop'); void badge.offsetWidth; badge.classList.add('pop'); }, 780);
    }, 350);
  }

  function replayHero(root) {
    if (root.classList.contains('opt-b')) { const st = root.querySelector('.stage'); st.classList.add('pending'); st.classList.remove('handoff'); st.querySelectorAll('.fly').forEach((f) => f.remove()); }
    root.querySelectorAll('canvas.pm').forEach((cv) => {
      if (getComputedStyle(cv).display === 'none') return;
      const isB = root.classList.contains('opt-b') && cv.dataset.shape === 'play';
      run(cv, isB ? (eng, instant) => handoffB(root, eng, instant) : null);
    });
  }

  /* Search field: types each phrase, holds 1.8s, deletes it, types the next. Reduced motion: "tofu", still. */
  function typing(el) {
    if (!el) return;
    if (reduce()) { el.textContent = 'tofu'; return; }
    const P = ['tofu', 'crispy tofu recipes', 'tofu taste test', 'quick tofu dinners']; let i = 0;
    const type = (k) => { const s = P[i]; el.textContent = s.slice(0, k); if (k < s.length) setTimeout(() => type(k + 1), 75); else setTimeout(() => del(s.length), 1800); };
    const del = (k) => { el.textContent = P[i].slice(0, k); if (k > 0) setTimeout(() => del(k - 1), 35); else { i = (i + 1) % P.length; setTimeout(() => type(1), 300); } };
    el.textContent = ''; type(1);
  }
  if (ONLY && HEROES[ONLY]) {
    document.title = 'Hero ' + ONLY.toUpperCase();
    document.getElementById('root').innerHTML = HEROES[ONLY]();
    const root = document.querySelector('.rk');
    window.replayHero = () => replayHero(root);
    typing(root.querySelector('.typed'));
    if (!EMBED) window.replayHero();
    return;
  }

  /* ---------- Overview ---------- */
  const OPTS = [
    { id: '1', name: 'See a video that’s working? Remake it for your client.', good: 'Starts from the moment every social manager knows (spotting a video that works) and puts the product name in the answer. "Remake" doubles as the verb, so the name teaches itself.', risk: 'A question headline is softer than a promise, and "Remake" in italics may read as a brand word rather than a verb the first time.' },
    { id: '2', name: 'Trending on Monday. Posted by Friday.', good: 'The shortest and most memorable: a clear before and after, and it sells speed, the thing agencies say they lack. Big type, very readable on a phone.', risk: 'It doesn’t say what Remake does or who it is for; the sub-line has to do all of that. No italic word, so the hero loses its one accent.' },
    { id: '3', name: 'Find what’s working. Film your version. We’ll cut it.', good: 'The three steps of the product in three short sentences, and the italic "Film" keeps the current accent. The most honest about the new editing feature.', risk: 'Three lines take the most height, and "We’ll cut it" promises editing, so it must work well before this ships.' },
    { id: '4', name: 'Know what each client should film this week. (current)', good: 'Speaks to the agency’s real job (many clients, a weekly plan) and the current sub-line names who it is for: agencies with 5 to 20 clients.', risk: 'It describes planning only; it says nothing about the new footage and editing features.' },
  ];
  document.body.className = 'ov';
  document.getElementById('root').innerHTML = `<div class="wrap">
    <p class="meta">Remake · landing hero · 4 headlines · 4 Nov 2026</p>
    <h1>Four headlines, in place.</h1>
    <p class="lede">All four use hero Option 2, "Tiles become the card": the play mark assembles, then hands over to the demo card. Only the headline and the line under it change (1–3 share the new sub-line); headline size and line breaks are tuned for each. The demo card now matches the live page: YouTube, X and Reddit are disabled, and the search types its phrases.</p>
    ${OPTS.map((o) => `<section id="opt-${o.id}" aria-labelledby="h-${o.id}">
      <div class="opt-h"><div><p class="meta">Headline ${o.id}</p><h2 id="h-${o.id}">${o.name}</h2><p><b>Strength:</b> ${o.good}</p><p><b>Risk:</b> ${o.risk}</p></div>
        <button class="replay" data-replay="${o.id}">↻ Replay</button></div>
      <div class="frames">
        <div class="frame"><p class="cap">Desktop · 1280px</p><div class="vp" data-w="1280"><iframe title="Headline ${o.id}, desktop" src="?only=${o.id}&embed=1" width="1280" height="1000" scrolling="no" tabindex="-1"></iframe></div><a class="open" href="?only=${o.id}" target="_blank" rel="noopener">Open full size ↗</a></div>
        <div class="frame"><p class="cap">Phone · 390px</p><div class="vp phone" data-w="390"><iframe title="Headline ${o.id}, phone" src="?only=${o.id}&embed=1" width="390" height="1600" scrolling="no" tabindex="-1"></iframe></div></div>
      </div></section>`).join('')}
    <section><ul class="notes">
      <li>Words are exact as given. Italics only where asked: "Remake" in 1, "Film" in 3, "film" in 4, in mustard (the palette's stand-in for sky).</li>
      <li>Platform icons are simple marks drawn in the palette, not the platforms' brand artwork.</li>
      <li>The search keeps typing while the page is open, as on the live page; with reduced motion it shows "tofu" and the play mark shows its final state.</li>
    </ul></section>
  </div>`;

  // scale each iframe to its box; size the box to the hero's height
  const fit = () => document.querySelectorAll('.vp').forEach((vp) => {
    const f = vp.querySelector('iframe'), w = +vp.dataset.w, s = Math.min(1, vp.clientWidth / w);
    let h = 900; try { const d = f.contentDocument; const hero = d && d.querySelector('.rk'); if (hero) h = hero.scrollHeight; } catch (e) {}
    f.style.height = h + 'px'; f.style.transform = `scale(${s})`; vp.style.height = Math.ceil(h * s) + 'px';
  });
  document.querySelectorAll('.vp iframe').forEach((f) => f.addEventListener('load', fit));
  addEventListener('resize', fit);
  const playOpt = (id) => document.querySelectorAll(`#opt-${id} iframe`).forEach((f) => { try { f.contentWindow.replayHero && f.contentWindow.replayHero(); } catch (e) {} });
  document.querySelectorAll('[data-replay]').forEach((b) => b.addEventListener('click', () => playOpt(b.dataset.replay)));
  // each option plays once when it scrolls into view
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((es) => es.forEach((e) => {
      if (!e.isIntersecting) return; io.unobserve(e.target);
      const id = e.target.id.slice(4), go = () => playOpt(id);
      const fr = [...e.target.querySelectorAll('iframe')];
      if (fr.every((f) => { try { return f.contentWindow.replayHero; } catch (er) { return false; } })) go(); else fr.forEach((f) => f.addEventListener('load', () => { try { f.contentWindow.replayHero(); } catch (er) {} }, { once: true }));
    }), { threshold: 0.3 });
    document.querySelectorAll('section[id^=opt-]').forEach((s) => io.observe(s));
  }
})();
</script>
